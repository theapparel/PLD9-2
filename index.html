<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7DD4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="พอแล้วดีสโมสร">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>พอแล้วดีสโมสร Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: yellow brand band → 4 summary figures → tabs (งานและประชุม / ไทม์ไลน์ Gantt / กำหนดการ / ลิงก์). Tasks nest as a tree under each workstream; a side drawer edits one item. */
:root{
  --yellow:#F7DD4E; --yellow-soft:#FDF4C4; --on-yellow:#111111;
  --ground:#FFFFFF; --surface:#FFFFFF; --sunk:#F6F4EC; --line:#E8E4D6;
  --ink:#111111; --ink-2:#47443B; --ink-3:#7C7767;
  --meet:#111111; --on-meet:#F7DD4E;
  --ok:#2D7A4B; --ok-soft:#E1F1E6; --warn:#B25E00; --warn-soft:#FDEBD3; --bad:#C0261C; --bad-soft:#FBE2DF; --info:#3D6E9E; --info-soft:#E2ECF6;
  --shadow:0 14px 44px rgba(30,25,0,.2);
  color-scheme:light;
  --f:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-weight:300;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-weight:500;font-size:13px;letter-spacing:.06em;color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}

/* Brand band */
.band{background:#FFFFFF;color:#111;border-bottom:6px solid var(--yellow)}
.band .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px 28px;align-items:center;padding-block:22px}
.logo{width:clamp(150px,20vw,230px);height:auto;display:block}
.ev h1{font-size:clamp(24px,3.2vw,34px);font-weight:600;line-height:1.15}
.ev .facts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;font-size:15px;font-weight:400}
.ev .facts b{font-weight:600}
.ev .facts>span{white-space:nowrap}
.band-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:500;font-size:16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.dark{background:#111;border-color:#111;color:#F7DD4E}
.btn.dark:hover{background:#000}
.btn.onband{border-color:#111;color:#111}
.btn.onband:hover{background:var(--sunk)}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1.5px solid var(--ink);margin-top:22px}
.stat{padding:2px 18px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:500;line-height:1.25}
.stat .v small{font-size:17px;color:var(--ink-3)}
.stat .sub{font-size:15px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.alert .v{color:var(--bad)}
.stat .v.text.dl{color:var(--ink)}
.stat .v.text{font-family:var(--f);font-size:22px;font-weight:600;line-height:1.35;padding-top:6px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* Tabs + toolbar */
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;min-height:52px;padding:0 18px;font-weight:500;font-size:17px;color:var(--ink-2);border-bottom:4px solid transparent;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button svg{width:20px;height:20px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yellow)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;min-height:40px;padding:0 16px;border-radius:999px;font-weight:500;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);padding:0 16px 0 44px;font-size:16px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--ground)}
.chip .num{font-size:13px;opacity:.7}
.notice{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);font-size:15px}
main{padding-bottom:80px}

/* Board */
.stream{margin-top:32px}
.stream-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
.stream-head h2{font-size:22px;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;background:var(--yellow);border:2px solid #111;flex:none}
.stream-head .prog{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:15px}
.stream-head .prog .bar{width:90px;margin:0}
.row{display:grid;grid-template-columns:128px minmax(0,1fr) 190px;gap:18px;align-items:start;padding:16px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row .st{padding-top:2px}
.row .tt b{font-size:18px;line-height:1.4}
.row .tt .type{vertical-align:2px;margin-right:4px}
.row .who{display:block;font-size:15px;color:var(--ink-2);margin-top:2px}
.row .who b{display:inline;font-size:15px;font-weight:500;color:var(--ink)}
.extra{display:flex;gap:14px;margin-top:4px;font-size:13.5px;color:var(--ink-3)}
.extra span{display:inline-flex;align-items:center;gap:4px}.extra svg{width:15px;height:15px}
.when{text-align:right}
.when .dl,.when .dm{display:block;font-size:20px;font-weight:600;line-height:1.3}
.when .dl{color:var(--ink)}
.when.over .dl{color:var(--bad)}
.when .nd{color:var(--ink-3);font-size:14px}
.when .rds{justify-content:flex-end}
.row:hover{background:var(--sunk)}
.tcell{display:flex;gap:8px;align-items:flex-start;min-width:0}
.caret{flex:none;width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:-2px}
.caret svg{width:16px;height:16px;transition:transform .15s}
.caret[aria-expanded="false"] svg{transform:rotate(-90deg)}
.caret.ph{visibility:hidden}
.elbow{flex:none;width:16px;height:20px;border-left:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);border-bottom-left-radius:6px;margin-top:-6px;opacity:.6}
.tt{min-width:0}
.tt b{font-weight:500;display:block}
.sn{display:block;font-weight:300;font-size:15px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ppl span{font-size:12.5px;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-weight:400}
.subcount{font-size:12.5px;color:var(--ink-3);font-weight:400}
.addsub{border:0;background:transparent;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:2px 0;margin-top:2px}
.who{font-size:15px;color:var(--ink-2);min-width:0}
.who b{display:block;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:15px}
.when .rel{display:block;font-size:13px;color:var(--ink-3)}
.when.over .rel{color:var(--bad);font-weight:500}
.cnt{display:flex;gap:10px;justify-content:flex-end;color:var(--ink-3);font-size:14px}
.cnt span{display:inline-flex;gap:4px;align-items:center}
.cnt svg{width:16px;height:16px}
.row.dim .tt b{color:var(--ink-3)}
.row.done .tt b{text-decoration:line-through;text-decoration-thickness:1px}
.tags{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.type{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:600}
.type.task{background:var(--yellow);color:#111}
.type.meeting{background:var(--meet);color:var(--on-meet)}
.s-todo{background:var(--sunk);color:var(--ink-2)}
.s-doing{background:var(--info-soft);color:var(--info)}
.s-waiting{background:var(--warn-soft);color:var(--warn)}
.s-done{background:var(--ok-soft);color:var(--ok)}
.m-up{background:var(--info-soft);color:var(--info)}
.m-need{background:var(--warn-soft);color:var(--warn)}
.m-ok{background:var(--ok-soft);color:var(--ok)}
.rds{display:flex;gap:4px;margin-top:4px}
.rd{width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:600;display:grid;place-items:center;border:1.5px solid var(--ink-3);color:var(--ink-2)}
.rd.done{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.rd.over{border-color:var(--bad);color:#fff;background:var(--bad)}
.rd.nodate{border-color:var(--line);color:var(--ink-3)}
.empty{padding:22px 8px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.add-row{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px}
.linkbtn{border:0;background:transparent;font-weight:500;min-height:42px;padding:0 8px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line);color:var(--ink)}
.linkbtn:hover{text-decoration-color:var(--ink)}
.linkbtn svg{width:18px;height:18px}

/* Gantt */
.tl{margin-top:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.tl-scroll{overflow:auto;max-height:70vh;max-height:70dvh}
.tl-head{position:sticky;top:0;z-index:6;background:var(--surface);box-shadow:0 1px 0 var(--line),0 4px 10px rgba(0,0,0,.06)}
.tl-head .tl-track{background:var(--surface)}
.tl-head .tl-name{z-index:7;flex-direction:row;align-items:center;justify-content:space-between;gap:6px}
.tl-name .tl-wide{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;min-height:32px;padding:0 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.tl.wide .tl-name{width:420px}
.tl-grid{position:relative;min-width:max-content}
.tl-row{display:flex;min-height:48px;border-bottom:1px solid var(--line)}
.tl-row.group{min-height:38px;background:var(--sunk)}
.tl-name{position:sticky;left:0;z-index:4;width:270px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.tl-row.group .tl-name{background:var(--sunk);font-weight:600;font-size:14px;color:var(--ink-2)}
.tl-name button{border:0;background:transparent;text-align:left;padding:0;font-weight:500;font-size:15px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.tl-name.parent button{font-weight:600}
.tl-name small{color:var(--ink-3);font-size:13px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.tl-track{position:relative;flex:none}
.tl-days{display:flex}
.tl-day{flex:none;text-align:center;font-size:11px;color:var(--ink-3);padding:6px 0;border-left:1px solid var(--line);line-height:1.3}
.tl-day b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink)}
.tl-day.we{background:var(--sunk)}
.tl-day.ev{background:var(--yellow);color:#111}.tl-day.ev b{color:#111}
.tl-day.setup{background:var(--yellow-soft)}
.tl-day.dl b{font-weight:700}.tl-day.dl{box-shadow:inset 0 -2px 0 var(--ink)}
.tl-col{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.tl-col.ev{background:var(--yellow);opacity:.22}
.tl-col.setup{background:repeating-linear-gradient(135deg,var(--yellow) 0 4px,transparent 4px 9px);opacity:.3}
.g-span{position:absolute;z-index:1;top:calc(50% - 6px);height:12px;border-radius:4px;background:var(--yellow);box-shadow:inset 0 0 0 1.5px #111;border:0;padding:0}
.g-span.done{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line)}
.g-sum{position:absolute;z-index:1;top:calc(50% - 4px);height:8px;background:var(--ink);border:0;padding:0}
.g-sum::before,.g-sum::after{content:"";position:absolute;top:8px;border:5px solid transparent;border-top-color:var(--ink)}
.g-sum::before{left:0;border-left-color:var(--ink)}
.g-sum::after{right:0;border-right-color:var(--ink)}
.g-ms{position:absolute;z-index:2;top:calc(50% - 12px);width:24px;height:24px;margin-left:-12px;border:0;padding:0;background:transparent;display:grid;place-items:center}
.g-ms i{position:absolute;inset:4px;transform:rotate(45deg);border-radius:2px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.g-ms b{position:relative;font-size:10.5px;font-weight:700;color:var(--ink);font-family:var(--mono)}
.g-ms.done i{background:var(--ink);box-shadow:none}.g-ms.done b{color:var(--ground)}
.g-ms.over i{background:var(--bad);box-shadow:none}.g-ms.over b{color:#fff}
.g-meet{position:absolute;z-index:2;top:calc(50% - 13px);height:26px;border-radius:999px;background:var(--meet);color:var(--on-meet);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;border:0;padding:0 6px;white-space:nowrap;overflow:hidden}
.tl-line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--info);z-index:3;pointer-events:none}
.tl-legend{display:flex;flex-wrap:wrap;gap:10px 20px;padding:12px 16px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);align-items:center}
.tl-legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:26px;height:12px;border-radius:4px}
.swd{display:inline-block;width:13px;height:13px;transform:rotate(45deg);border-radius:2px}
.tl-empty{padding:28px 20px;color:var(--ink-2)}


/* To-do */
.td{margin-top:8px}
.td-group{margin-top:26px}
.td-group h3{font-size:19px;font-weight:600;padding-bottom:8px;border-bottom:1.5px solid var(--ink);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.td-group h3 .dl{color:var(--ink)}
.td-group.over h3{color:var(--bad);border-bottom-color:var(--bad)}
.td-in{font-size:15px;font-weight:400;color:var(--ink-2)}
.td-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:start;padding:14px 4px;border-bottom:1px solid var(--line)}
.td-check{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:var(--surface);font-size:20px;font-weight:700;display:grid;place-items:center;color:var(--ground)}
.td-check[aria-pressed="true"]{background:var(--ink)}
.td-check[disabled]{opacity:.5;cursor:default}
.td-main{min-width:0;cursor:pointer}
.td-title{font-size:18px;font-weight:500;line-height:1.4}
.td-round{display:inline-block;font-size:13px;font-weight:500;padding:1px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2);vertical-align:2px;margin-left:4px}
.td-meta{font-size:15px;color:var(--ink-2);margin-top:2px}
.td-meta b{font-weight:500;color:var(--ink)}
.td-req{font-size:14.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-date{text-align:right}
.td-date b{display:block;font-size:20px;font-weight:600;color:var(--ink);line-height:1.3}
.td-row.is-over .td-date b{color:var(--bad)}
.td-date span{display:block;font-size:13.5px;color:var(--ink-3)}
.td-row.is-over .td-date span{color:var(--bad);font-weight:500}
.td-row.is-done .td-title{text-decoration:line-through;color:var(--ink-3)}
.td-row.is-done .td-date b{color:var(--ink-3)}
.td-row.is-done .td-round{border-color:var(--line);color:var(--ink-3)}
.td-done summary{font-size:19px;font-weight:600;padding-bottom:8px;border-bottom:1.5px solid var(--ink);cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px}
@media (max-width:520px){ .td-row{grid-template-columns:minmax(0,1fr)} .td-date{grid-column:1;text-align:left;display:flex;gap:10px;align-items:baseline} .td-date b{display:inline;font-size:17px} .td-date span{display:inline} }

/* Per-person tracker */
.pg{font-weight:600;color:var(--ink-2)}
.td-sub{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.td-sub b{font-weight:600;color:var(--ink)}
.gpick{display:flex;flex-wrap:wrap;gap:8px}
.gpick button{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.gpick button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.gpick .num{font-size:12.5px;opacity:.7}
.cnt-b{margin-left:auto;font-size:14px;font-weight:500;color:var(--ink-2);padding-left:10px}
.sec h4{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.tround{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.trh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:15px}
.tgrp{display:flex;flex-direction:column;gap:4px}
.tg{font-size:12.5px;color:var(--ink-3);font-weight:500}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm{min-height:42px;min-width:58px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.nm.yes{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.nm.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.mx-wrap{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh;max-height:70dvh;background:var(--surface)}
.mx{border-collapse:separate;border-spacing:0;font-size:14px}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;background:var(--surface)}
.mx thead th{position:sticky;top:0;z-index:3;vertical-align:bottom}
.mx .corner{position:sticky;left:0;top:0;z-index:5;text-align:left;padding:10px 12px;font-size:12.5px;color:var(--ink-3);font-weight:500;min-width:150px}
.mx .rh{position:sticky;left:0;z-index:2;text-align:left;padding:6px 12px;min-width:150px;font-weight:400}
.mx .rh b{display:block;font-weight:500;font-size:15px}
.mx .rh small{color:var(--ink-3);font-size:12.5px}
.mx tr.gr .rh,.mx tr.gr td{background:var(--sunk);font-weight:600;font-size:13px;color:var(--ink-2);padding:6px 12px}
.ch button{border:0;background:transparent;width:112px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.ch .ct{font-weight:500;font-size:13px;line-height:1.3;color:var(--ink)}
.ch .cr{font-size:11.5px;color:var(--ink-2);background:var(--sunk);border-radius:999px;padding:0 8px;margin-top:2px}
.ch .cd{font-weight:600;font-size:13px;color:var(--ink);margin-top:2px}
.ch .cc{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ch.over .cd{color:var(--bad)}
.mx td{text-align:center}
.cell{position:relative;width:100%;min-width:112px;height:44px;border:0;background:transparent;font-size:15px;font-weight:700}
.cell::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:6px;border:1.5px solid var(--ink-3);box-sizing:border-box}
.cell span{position:relative}
.cell.yes::before{background:var(--ink);border-color:var(--ink)}
.cell.yes{color:var(--ground)}
.cell.no::before{background:var(--bad-soft);border-color:var(--bad)}
.cell.no{color:var(--bad)}
.cell.over::before{border-color:var(--bad);border-width:2px}
.mx td.na{color:var(--line);font-size:16px}
.sw2{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink-3);font-style:normal;font-size:12px;font-weight:700}
.sw2.yes{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.sw2.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sw2.over{border-color:var(--bad);border-width:2px}
.sw2.na{border-color:transparent;color:var(--ink-3)}
@media (max-width:700px){ .mx .corner,.mx .rh{min-width:104px;padding-inline:8px} .ch button{width:92px} .cell{min-width:92px} }
/* Agenda */
.days{display:grid;gap:22px;margin-top:22px}
.day{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.day-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;background:var(--yellow);color:#111}
.day-head.setup{background:var(--yellow-soft);color:var(--ink)}
.day-head h3{font-size:20px;font-weight:600}
.day-head .tag{font-size:13px;font-weight:600;border:1.5px solid currentColor;border-radius:999px;padding:2px 10px}
.day-head .grow{flex:1}
.ag{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.ag .tm{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;padding-top:2px}
.ag h4{font-size:17px;font-weight:600}
.ag p{margin:4px 0 0;color:var(--ink-2);white-space:pre-wrap;font-size:15px}
.room{display:inline-block;margin-top:6px;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.ag-empty{padding:18px;color:var(--ink-3);border-top:1px solid var(--line)}

/* Links */
.lgroup{margin-top:28px}
.lgroup h2{font-size:20px;font-weight:600;padding-bottom:8px;border-bottom:1.5px solid var(--ink)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.lrow .lt{min-width:0}
.lrow a{font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--yellow);text-decoration-thickness:3px;overflow-wrap:anywhere}
.lrow small{display:block;color:var(--ink-3);font-size:14px;overflow-wrap:anywhere}
.lrow .acts{display:flex;gap:6px}


.notice .r2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.notice .r2 .inp{flex:1 1 240px;min-height:46px}
.sync{align-self:center;font-size:13px;color:var(--ink-3);white-space:nowrap}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(15,12,0,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--ground);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#FFFFFF;color:#111;border-bottom:5px solid var(--yellow)}
.d-head h3{font-size:20px;font-weight:600;flex:1;min-width:0}
.crumb{font-size:13px;font-weight:400;display:block;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:46px;height:46px;border-radius:999px;border:1.5px solid #111;background:transparent;display:grid;place-items:center;flex:none;color:#111}
.iconbtn svg{width:20px;height:20px}
.d-body{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.fl{font-weight:500;font-size:15px}
.hint{font-size:13px;color:var(--ink-3);font-weight:300}
.inp{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:17px;width:100%}
textarea.inp{min-height:110px;resize:vertical;line-height:1.55}
.inp:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick.two-up{grid-template-columns:1fr 1fr}
.pick button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pick button.k-task[aria-pressed="true"]{background:var(--yellow);color:#111;border-color:#111;box-shadow:inset 0 0 0 1.5px #111}
.pick button.k-meeting[aria-pressed="true"]{background:var(--meet);color:var(--on-meet);border-color:var(--meet)}
.pick button.s-todo[aria-pressed="true"]{background:var(--sunk);border-color:var(--ink-2)}
.pick button.s-doing[aria-pressed="true"]{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.pick button.s-waiting[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pick button.s-done[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.sec{border-top:1.5px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.sec h4{font-size:18px;font-weight:600}
.lnk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 46px;gap:8px}
.rnd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto 46px;gap:8px;align-items:center}
.rnd .ok{min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.rnd .ok[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.lnk .iconbtn,.rnd .iconbtn{border-color:var(--line);color:var(--ink)}
.chipin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 8px}
.chipin:focus-within{border-color:var(--ink)}
.chipin input{border:0;outline:none;background:transparent;flex:1 1 140px;min-width:0;min-height:34px;font-size:16px;padding:0 6px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 12px;font-size:15px}
.pchip button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.pchip button svg{width:14px;height:14px}
.join{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.join a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--meet);color:var(--on-meet);font-weight:500;text-decoration:none}
.join a svg{width:18px;height:18px}
.d-foot{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line)}
.d-foot .grow{flex:1}
.stamp{font-size:13px;color:var(--ink-3)}
.vlinks{display:flex;flex-direction:column;gap:6px}
.vlinks a{font-weight:500;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:3px;text-underline-offset:4px;overflow-wrap:anywhere}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cmt .by{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3);flex-wrap:wrap}
.cmt .by img{width:24px;height:24px;border-radius:50%}
.cmt .by b{color:var(--ink);font-weight:500}
.cmt p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt .del{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-size:13px;text-decoration:underline;min-height:32px}
.newc .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.newc .r input{flex:1 1 160px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px}
.srow .iconbtn{border-color:var(--line);color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#111;color:#F7DD4E;padding:12px 22px;border-radius:999px;font-weight:500;z-index:30;font-size:16px;max-width:calc(100% - 32px)}
.skeleton{padding:28px 0;color:var(--ink-3)}

@media (max-width:900px){
  .band .wrap{grid-template-columns:minmax(0,1fr)}
  .band-actions{justify-content:flex-start}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 4px}
  .row .st{grid-column:1;grid-row:1}
  .row .when{grid-column:2;grid-row:1 / span 2}
  .row .tcell{grid-column:1;grid-row:2}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0;padding-left:0}
  .tl-name{width:170px}
  .ag{grid-template-columns:minmax(0,1fr) auto}
  .ag .tm{grid-column:1 / -1}
}
@media (max-width:520px){
  .wrap{padding-inline:16px}
  .two,.three{grid-template-columns:1fr}
  .pick{grid-template-columns:1fr 1fr}
  .stat .v{font-size:28px}
  .lnk{grid-template-columns:minmax(0,1fr) 46px}
  .lnk input:nth-child(2){grid-column:1;grid-row:2}
  .rnd{grid-template-columns:minmax(0,1fr) 46px}
  .rnd .rl{grid-column:1}.rnd .rdte{grid-column:1;grid-row:2}.rnd .ok{grid-column:1;grid-row:3;justify-self:start}.rnd .iconbtn{grid-column:2;grid-row:1}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}

.tabs .sm{display:none}
.fab{display:none}
@media (max-width:700px){
  .band .wrap{grid-template-columns:auto minmax(0,1fr);gap:10px 14px;padding-block:14px}
  .logo{width:112px}
  .ev h1{font-size:21px}
  .ev .facts{font-size:13.5px;gap:2px 12px}
  .band-actions{grid-column:1 / -1}
  .band-actions #addItem{display:none}
  .btn.onband{min-height:40px;font-size:14px;padding:0 14px}
  .summary{grid-template-columns:1fr 1fr;margin-top:12px}
  .stat{padding:10px 12px 12px}
  .stat:nth-child(odd){border-left:0;padding-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat .v{font-size:26px}
  .stat .v.text{font-size:18px}
  .stat .sub{font-size:13.5px}
  .tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ground);margin-inline:-16px;padding-inline:8px;gap:0;overflow-x:auto;scrollbar-width:none}
  .tabs button{flex:1 0 auto;flex-direction:column;gap:2px;min-height:58px;padding:6px 10px;font-size:13.5px;justify-content:center}
  .tabs .lg{display:none}.tabs .sm{display:inline}
  .toolbar{margin-top:12px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .chip{flex:none}
  .stream{margin-top:24px}
  .stream-head h2{font-size:19px}
  .stream-head{row-gap:4px}
  .stream-head h2{flex:1 1 calc(100% - 40px);min-width:0}
  .stream-head .prog{margin-left:0;flex:1}
  .stream-head .prog .bar{width:70px}
  .row .tt b{font-size:17px}
  .when .dl,.when .dm{font-size:18px}
  .tl-name{width:132px;padding-inline:8px}
  .tl.wide .tl-name{width:230px}
  .tl-head .tl-name{flex-direction:column;align-items:flex-start}
  .tl-name button{font-size:13.5px}
  .tl-legend{font-size:13px;gap:8px 14px}
  .day-head h3{font-size:17px}
  .ag{padding:12px 14px}
  .d-body{padding:16px}
  .d-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .d-foot .btn{flex:1 1 auto;justify-content:center}
  .d-foot .grow{display:none}
  main{padding-bottom:110px}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;align-items:center;gap:6px;min-height:58px;padding:0 22px;border-radius:999px;border:0;background:#111;color:#F7DD4E;font-weight:600;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .fab svg{width:22px;height:22px}
  .fab[hidden]{display:none}
}
</style>

const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const dnum=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5;};
const nstr=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;};
const MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const DOW=["อา","จ","อ","พ","พฤ","ศ","ส"], DOWL=["วันอาทิตย์","วันจันทร์","วันอังคาร","วันพุธ","วันพฤหัสบดี","วันศุกร์","วันเสาร์"];
const dd=s=>{const n=dnum(s);return n==null?null:new Date(n*864e5);};
const fShort=s=>{const d=dd(s);return d?`${d.getUTCDate()} ${MON[d.getUTCMonth()]}`:"";};
const fLong=s=>{const d=dd(s);return d?`${DOWL[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()+543}`:"";};
const fRange=(a,b)=>{const x=dd(a),y=dd(b);if(!x)return"";if(!y||a===b)return fShort(a);return x.getUTCMonth()===y.getUTCMonth()?`${x.getUTCDate()}–${y.getUTCDate()} ${MON[y.getUTCMonth()]}`:`${fShort(a)} – ${fShort(b)}`;};

const subCount=(i,r,k)=>{const ppl=reqPeople(i);const rk=rKey(r,k);return {done:ppl.filter(p=>subOf(i,rk,p.name)).length,total:ppl.length,missing:ppl.filter(p=>!subOf(i,rk,p.name)).map(p=>p.name)};};

const hasInput=(i,cc)=>!!((i.subs&&Object.values(i.subs).some(o=>o&&Object.values(o).some(Boolean)))||(i.requirement||"").trim()||(i.links||[]).some(l=>(l.url||l.label||"").trim())||(Array.isArray(i.rounds)&&i.rounds.some(r=>r.done))||(cc??S.comments.filter(c=>c.taskId===i.id).length));

const roundsDated=i=>rounds(i).map((r,k)=>({...r,n:k+1})).filter(r=>dnum(r.date)!=null);
const nextRound=i=>roundsDated(i).filter(r=>!r.done).sort((a,b)=>dnum(a.date)-dnum(b.date))[0]||null;
const lastDate=i=>{const d=roundsDated(i).map(r=>dnum(r.date));return d.length?Math.max(...d):null;};
const isOver=i=>!isM(i)&&i.status!=="done"&&roundsDated(i).some(r=>!r.done&&dnum(r.date)<TD());
const meetState=i=>{const n=dnum(i.date);if(n==null||n>=TD())return"up";return (i.summary||"").trim()?"ok":"need";};

const safeUrl=u=>{u=String(u||"").trim();if(!u)return"";if(/^https?:\/\//i.test(u))return u;if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))return "https://"+u;return"";};

/* tree */
let TREE={byId:{},kids:{},roots:[],parentOf:()=>null};
function buildTree(){
  const byId={},kids={}; S.items.forEach(i=>byId[i.id]=i);
  const parentOf=i=>{ const p=i.parentId&&byId[i.parentId]; if(!p) return null;
    let x=p,guard=0; while(x&&guard++<50){ if(x.id===i.id) return null; x=x.parentId?byId[x.parentId]:null; } return p.id; };
  const roots=[]; S.items.forEach(i=>{ const p=parentOf(i); if(p){(kids[p]=kids[p]||[]).push(i);} else roots.push(i); });
  TREE={byId,kids,roots,parentOf};
}
const kidsOf=id=>TREE.kids[id]||[];
const rootOf=i=>{let x=i,g=0;while(g++<50){const p=TREE.parentOf(x);if(!p)return x;x=TREE.byId[p];}return x;};
const streamOf=i=>rootOf(i).stream||"";
const descendants=id=>{const out=[];const walk=x=>kidsOf(x).forEach(k=>{out.push(k);walk(k.id);});walk(id);return out;};
const pathOf=i=>{const p=[];let x=i,g=0;while(x&&g++<20){p.unshift(x.title);const q=TREE.parentOf(x);x=q?TREE.byId[q]:null;}return p;};
function spanOf(i){
  const pts=[]; const add=x=>{ if(isM(x)){const n=dnum(x.date);if(n!=null)pts.push(n);} else { const s=dnum(x.start); if(s!=null)pts.push(s); roundsDated(x).forEach(r=>pts.push(dnum(r.date))); } };
  add(i); descendants(i.id).forEach(add); return pts.length?[Math.min(...pts),Math.max(...pts)]:null;
}

/* ---------------- filtering in tree order ---------------- */
function matches(i){ const q=S.q.trim().toLowerCase();
  return (S.kind==="all"||(i.type||"task")===S.kind)&&(!q||[i.title,i.pic,people(i).join(" "),i.requirement,i.agenda,i.summary].some(x=>String(x||"").toLowerCase().includes(q))); }
function treeDate(i){ const ds=[i,...descendants(i.id)].map(keyDate).filter(n=>n!=null); return ds.length?Math.min(...ds):null; }
function sorted(a){return a.slice().sort((x,y)=>{
  const dx=treeDate(x)??1e9,dy=treeDate(y)??1e9;if(dx!==dy)return dx-dy;return String(x.from||"").localeCompare(y.from||"")||(x.createdAt||0)-(y.createdAt||0)||String(x.title).localeCompare(String(y.title));});}
function flatten(rootList,respectCollapse){
  const out=[]; const filtering=!!(S.q.trim()||S.kind!=="all");
  const visible=i=>matches(i)||descendants(i.id).some(matches);
  const walk=(list,d)=>{ for(const i of sorted(list)){ if(!visible(i)) continue; const k=kidsOf(i.id);
    out.push({i,depth:d,hasKids:k.length>0}); if(k.length&&(!respectCollapse||filtering||!S.collapsed.has(i.id))) walk(k,d+1); } };
  walk(rootList,0); return out;
}
const streamKeys=()=>{const ks=streams().map(s=>s.key);const orphan=TREE.roots.some(i=>!ks.includes(i.stream||""));return orphan?[...ks,"__orphan"]:ks;};
const rootsIn=k=>TREE.roots.filter(i=>k==="__orphan"?!streams().some(s=>s.key===(i.stream||"")):(i.stream||"")===k);

function rowHTML({i,depth,hasKids}){

  } else { const es=effStatus(i); st=`<span class="pill s-${es}">${esc(t("st_"+es))}</span>`;
    const rs=rounds(i), nr=nextRound(i);
    if(nr&&i.status!=="done"){ const n=dnum(nr.date); over=n<td; date=`<span class="dl">${esc(fShort(nr.date))}</span>`; sub=`${nr.label||t("round",nr.n)} · ${n<td?t("over",td-n):t("left",n-td)}`; }
    else if(rs.length&&rs.every(r=>r.done)) sub=t("all_rounds_done");
    if(rs.length>1) rd=`<span class="rds">${rs.map((r,k)=>{const o=!r.done&&dnum(r.date)!=null&&dnum(r.date)<td&&i.status!=="done";return `<span class="rd ${r.done?"done":o?"over":!r.date?"nodate":""}" title="${esc(r.label||t("round",k+1))} · ${esc(fShort(r.date)||"—")}">${k+1}</span>`;}).join("")}</span>`;
  }
  const snip=meet?(i.summary||i.agenda||""):"";
  const lc=(i.links||[]).length+(meet&&i.mlink?1:0), cc=ccount(i.id), ppl=people(i), nk=kidsOf(i.id).length;
  const who=[i.pic?`PIC: <b>${esc(i.pic)}</b>`:"", ppl.length?`ผู้เกี่ยวข้อง: ${esc(ppl.join(", "))}`:""].filter(Boolean).join(" · ");
  let prog="";
  if(meet){ const a=attCount(i); if(a.total) prog=`มา ${a.yes}/${a.total}`; }
  else if(reqPeople(i).length){ const rs=rounds(i); const nr=nextRound(i); const k=nr?nr.n-1:Math.max(rs.length-1,0); if(rs[k]){ const c=subCount(i,rs[k],k); prog=`ส่งแล้ว ${c.done}/${c.total}`; } }
  const extra=[prog?`<b class="pg">${esc(prog)}</b>`:"",nk?esc(t("subs",nk)):"", lc?`${I.link}${lc}`:"", cc?`${I.chat}${cc}`:""].filter(Boolean).map(x=>`<span>${x}</span>`).join("");
  const indent=depth?`<span style="width:${(depth-1)*28}px;flex:none"></span><span class="elbow"></span>`:"";
  return `<div class="row ${closed(i)?"dim":""} ${!meet&&i.status==="done"?"done":""}" data-open="${esc(i.id)}" tabindex="0" role="button" aria-label="${esc(i.title)}">
    <span class="st">${st}</span>
    <span class="tcell">${indent}${hasKids?`<button type="button" class="caret" data-toggle="${esc(i.id)}" aria-expanded="${!S.collapsed.has(i.id)}" aria-label="ย่อหรือขยายงานย่อย">${I.down}</button>`:""}
      <span class="tt"><b>${meet?`<span class="type meeting">ประชุม</span> `:""}${esc(i.title)}</b>
      ${who?`<span class="who">${who}</span>`:""}
      ${snip?`<span class="sn">${esc(snip.split("\n").find(x=>x.trim())||"")}</span>`:""}
      ${extra?`<span class="extra">${extra}</span>`:""}</span></span>
    <span class="when ${over?"over":""}">${date||`<span class="nd">${esc(meet?"ยังไม่กำหนดวัน":t("no_due"))}</span>`}${sub?`<span class="rel">${esc(sub)}</span>`:""}${rd}</span>
  </div>`;
}
function renderBoard(){
  const w=canW(); let h="";
  const keys=S.stream==="all"?streamKeys():[S.stream];
  for(const k of keys){
    const roots=rootsIn(k); const rows=flatten(roots,true);
    if((S.q||S.kind!=="all")&&!rows.length) continue;
    const all=roots.flatMap(r=>[r,...descendants(r.id)]); const tk=all.filter(i=>!isM(i)), d=tk.filter(i=>i.status==="done").length, pct=tk.length?Math.round(d/tk.length*100):0;
    h+=`<section class="stream"><div class="stream-head"><span class="dot"></span><h2>${esc(k==="__orphan"?t("orphan"):sName(k))}</h2>
      <span class="prog">${tk.length?`<span class="num">${esc(t("done_of",d,tk.length))}</span><span class="bar"><i style="width:${pct}%"></i></span>`:""}</span>${w&&k!=="__orphan"?`<button type="button" class="linkbtn" data-sedit="${esc(k)}">${I.pen}แก้ไขหมวด</button>`:""}</div>
      <div>${rows.length?rows.map(rowHTML).join(""):`<div class="empty">${esc(t("empty_stream"))}</div>`}</div>
      ${w&&k!=="__orphan"?`<div class="add-row"><button type="button" class="linkbtn" data-new="task" data-s="${esc(k)}">${I.plus}${esc(t("add_task"))}</button><button type="button" class="linkbtn" data-new="meeting" data-s="${esc(k)}">${I.plus}${esc(t("add_meet"))}</button></div>`:""}
    </section>`;
  }
  if(w&&S.stream==="all"&&!S.q&&S.kind==="all") h+=`<div style="margin-top:28px"><button type="button" class="btn dark" data-snew="1">${I.plus}เพิ่มหมวดงาน</button></div>`;
  $("main").innerHTML=h||`<p class="skeleton">${esc(t("no_match"))}</p>`;
}

/* ---------------- Gantt ---------------- */
function renderTimeline(){
  const m=S.meta||{}, td=TD();
  const keys=S.stream==="all"?streamKeys():[S.stream];
  const groups=keys.map(k=>({k,rows:flatten(rootsIn(k),true)})).filter(g=>g.rows.length);
  const su=dnum(m.setupDate), st=dnum(m.startDate), en=dnum(m.endDate)??st;
  let lo=td,hi=td,any=false;
  groups.forEach(g=>g.rows.forEach(({i})=>{const sp=spanOf(i);if(sp){any=true;lo=Math.min(lo,sp[0]);hi=Math.max(hi,sp[1]);}}));
  for(const x of [su,st,en]) if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x);}
  if(!any&&st==null){ $("main").innerHTML=`<div class="tl"><div class="tl-empty">${esc(t("tl_empty"))}</div></div>`; return; }
  lo-=2; hi+=2; if(hi-lo>300) lo=Math.max(lo,td-30);
  const W=window.innerWidth<520?28:34, days=hi-lo+1, TW=days*W, X=n=>(n-lo)*W;
  const isEv=n=>st!=null&&n>=st&&n<=en, isSu=n=>su!=null&&n===su;
  const dlDays=new Set(); groups.forEach(g=>g.rows.forEach(({i})=>{ if(!isM(i)&&i.status!=="done") roundsDated(i).forEach(r=>{ if(!r.done) dlDays.add(dnum(r.date)); }); }));
  let head=`<div class="tl-row tl-head"><div class="tl-name"><span class="label">งาน / วันที่</span><button type="button" class="tl-wide" data-tlwide="1">${S.tlWide?"⇤ แคบลง":"ขยายชื่อ ⇥"}</button></div><div class="tl-track" style="width:${TW}px"><div class="tl-days">`;
  for(let k=0;k<days;k++){const n=lo+k,d=new Date(n*864e5),wd=d.getUTCDay();const top=(k===0||d.getUTCDate()===1)?MON[d.getUTCMonth()]:DOW[wd];
    head+=`<div class="tl-day ${isEv(n)?"ev":isSu(n)?"setup":(wd===0||wd===6)?"we":""} ${dlDays.has(n)?"dl":""}" style="width:${W}px">${esc(top)}<b>${d.getUTCDate()}</b></div>`;}
  head+=`</div></div></div>`;
  let cols=""; for(let k=0;k<days;k++){const n=lo+k; if(isEv(n)) cols+=`<div class="tl-col ev" data-x="${k*W}" style="width:${W}px"></div>`; else if(isSu(n)) cols+=`<div class="tl-col setup" data-x="${k*W}" style="width:${W}px"></div>`;}
  const today=(td>=lo&&td<=hi)?`<div class="tl-line" data-x="${X(td)+W/2}"></div>`:"";
  let body="", und=[];
  if(!groups.length) body=`<div class="tl-empty">${esc(t("tl_empty"))}</div>`;
  for(const g of groups){
    body+=`<div class="tl-row group"><div class="tl-name">${esc(g.k==="__orphan"?t("orphan"):sName(g.k))}</div><div class="tl-track" style="width:${TW}px"></div></div>`;
    for(const {i,depth,hasKids} of g.rows){
      let marks="";
      if(isM(i)){ const n=dnum(i.date); if(n!=null&&n>=lo&&n<=hi) marks=`<button type="button" class="g-meet" style="left:${X(n)+2}px;width:${Math.max(W-4,40)}px" data-open="${esc(i.id)}" title="${esc(i.title)} · ${esc(fShort(i.date))} ${esc(i.from||"")}">${esc(i.from||"ประชุม")}</button>`; else und.push(i); }
      else {
        if(hasKids){ const sp=spanOf(i); if(sp){ const a=Math.max(sp[0],lo),b=Math.min(sp[1],hi); marks+=`<button type="button" class="g-sum" style="left:${X(a)+4}px;width:${Math.max((b-a+1)*W-8,10)}px" data-open="${esc(i.id)}" title="${esc(i.title)}"></button>`; } }
        const rs=roundsDated(i), s=dnum(i.start);
        if(!hasKids&&(rs.length||s!=null)){ const pts=[...(s!=null?[s]:[]),...rs.map(r=>dnum(r.date))]; const a=Math.max(Math.min(...pts),lo), b=Math.min(Math.max(...pts),hi);
          marks+=`<button type="button" class="g-span ${i.status==="done"?"done":""}" style="left:${X(a)+W/2}px;width:${Math.max((b-a)*W,6)}px" data-open="${esc(i.id)}" title="${esc(i.title)}"></button>`; }
        rs.forEach(r=>{ const n=dnum(r.date); if(n<lo||n>hi) return; const o=!r.done&&n<td&&i.status!=="done";
          marks+=`<button type="button" class="g-ms ${r.done?"done":o?"over":""}" style="left:${X(n)+W/2}px" data-open="${esc(i.id)}" title="${esc(r.label||t("round",r.n))} · ${esc(fShort(r.date))} · ${esc(r.done?t("rnd_done"):t("rnd_pending"))}"><i></i><b>${r.n}</b></button>`; });
        if(!marks) und.push(i);
      }
      body+=`<div class="tl-row"><div class="tl-name ${hasKids?"parent":""}" style="padding-left:${12+depth*18}px"><button type="button" data-open="${esc(i.id)}">${depth?"└ ":""}${esc(i.title)}</button>${(i.pic||people(i).length)?`<small>${esc([i.pic,...people(i)].filter(Boolean).join(", "))}</small>`:""}</div>
        <div class="tl-track" style="width:${TW}px">${marks}</div></div>`;
    }
  }
  const undH=und.length?`<div class="tl-legend"><b style="font-weight:500">${esc(t("undated"))}:</b>${und.map(i=>`<button type="button" class="linkbtn" data-open="${esc(i.id)}">${esc(i.title)}</button>`).join("")}</div>`:"";
  $("main").innerHTML=`<div class="tl ${S.tlWide?"wide":""}"><div class="tl-scroll" id="tlS"><div class="tl-grid">${head}${body}${cols}${today}</div></div>
   <div class="tl-legend">
    <span><i class="sw" style="background:var(--yellow);box-shadow:inset 0 0 0 1.5px #111;height:10px"></i>${esc(t("lg_span"))}</span>
    <span><i class="sw" style="background:var(--ink);height:7px;border-radius:0"></i>${esc(t("lg_sum"))}</span>
    <span><i class="swd" style="background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)"></i>${esc(t("lg_pend"))}</span>
    <span><i class="swd" style="background:var(--ink)"></i>${esc(t("lg_done"))}</span>
    <span><i class="swd" style="background:var(--bad)"></i>${esc(t("lg_over"))}</span>
    <span><i class="sw" style="background:var(--meet);border-radius:99px"></i>${esc(t("lg_meet"))}</span>
    <span><i class="sw" style="width:3px;border-left:2px dashed var(--info);border-radius:0"></i>${esc(t("lg_today"))}</span>
    ${su!=null?`<span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--yellow) 0 4px,transparent 4px 9px)"></i>${esc(t("lg_setup"))}</span>`:""}
    ${st!=null?`<span><i class="sw" style="background:var(--yellow)"></i>${esc(t("lg_event"))}</span>`:""}
   </div>${undH}</div>`;
  const nw=document.querySelector(".tl-name")?.getBoundingClientRect().width||270;
  document.querySelectorAll(".tl-col,.tl-line").forEach(el=>el.style.left=(nw+Number(el.dataset.x))+"px");
  const sc=$("tlS"); if(sc) sc.scrollLeft=Math.max(0,(td-lo-3)*W);
}

/* ---------------- to-do (every submission round, by date) ---------------- */
function todoRows(){
  const q=S.q.trim().toLowerCase(); const out=[];
  for(const i of S.items){ if(isM(i)) continue;
    if(S.stream!=="all"&&streamOf(i)!==S.stream) continue;
    if(q&&![i.title,i.pic,people(i).join(" "),i.requirement].some(x=>String(x||"").toLowerCase().includes(q))) continue;
    const rs=rounds(i);
    if(!rs.length) out.push({i,r:{label:t("round",1),date:"",done:i.status==="done"},k:0,n:1});
    rs.forEach((r,k)=>out.push({i,r,k,n:k+1}));
  }
  return out;
}
function todoRow(x,td){
  const {i,r,k,n}=x, d=dnum(r.date), done=!!r.done||i.status==="done", over=!done&&d!=null&&d<td;
  const who=[i.pic?`PIC: <b>${esc(i.pic)}</b>`:"",people(i).length?`ผู้เกี่ยวข้อง: ${esc(people(i).join(", "))}`:""].filter(Boolean).join(" · ");
  const parentPath=pathOf(i).slice(0,-1);
  const rel=d==null?"":done?"":over?t("over",td-d):t("left",d-td);
  return `<div class="td-row ${done?"is-done":""} ${over?"is-over":""}">
    <div class="td-main" data-open="${esc(i.id)}" role="button" tabindex="0">
      <div class="td-title">${esc(i.title)} <span class="td-round">${esc(r.label||t("round",n))}</span></div>
      ${(()=>{ if(!reqPeople(i).length) return ""; const c=subCount(i,r,k); return `<div class="td-sub"><b>ส่งแล้ว ${c.done}/${c.total}</b></div>`; })()}
      <div class="td-meta">${esc(sName(streamOf(i)))}${parentPath.length?" › "+esc(parentPath.join(" › ")):""}${who?" · "+who:""}</div>
    </div>
    <div class="td-date">${d!=null?`<b>${esc(fShort(r.date))}</b>`:`<span class="nd">ยังไม่กำหนดวัน</span>`}${rel?`<span>${esc(rel)}</span>`:done?`<span>${esc(t("rnd_done"))}</span>`:""}</div>
  </div>`;
}
function renderTodo(){
  if(S.pmode==="sub"||S.pmode==="att") return renderPeople();
  const td=TD(), rows=todoRows();
  const pend=rows.filter(x=>!(x.r.done||x.i.status==="done"));
  const dated=pend.filter(x=>dnum(x.r.date)!=null).sort((a,b)=>dnum(a.r.date)-dnum(b.r.date)||String(a.i.title).localeCompare(b.i.title));
  const undated=pend.filter(x=>dnum(x.r.date)==null);
  const done=rows.filter(x=>x.r.done||x.i.status==="done").sort((a,b)=>(dnum(b.r.date)??0)-(dnum(a.r.date)??0));
  let h="";
  const over=dated.filter(x=>dnum(x.r.date)<td);
  if(over.length) h+=`<section class="td-group over"><h3>เลยกำหนดส่ง <span class="num">${over.length}</span></h3>${over.map(x=>todoRow(x,td)).join("")}</section>`;
  const byDay={}; dated.filter(x=>dnum(x.r.date)>=td).forEach(x=>{(byDay[x.r.date]=byDay[x.r.date]||[]).push(x);});
  for(const day of Object.keys(byDay).sort()){ const n=dnum(day);
    h+=`<section class="td-group"><h3><span class="dl">${esc(fLong(day))}</span> <span class="td-in">${esc(t("in_days",n-td))}</span></h3>${byDay[day].map(x=>todoRow(x,td)).join("")}</section>`; }
  if(undated.length) h+=`<section class="td-group"><h3>ยังไม่กำหนดวันส่ง <span class="num">${undated.length}</span></h3>${undated.map(x=>todoRow(x,td)).join("")}</section>`;
  if(!pend.length) h+=`<p class="skeleton">ไม่มีงานค้างส่ง</p>`;
  if(done.length) h+=`<details class="td-group td-done"><summary>ส่งแล้ว <span class="num">${done.length}</span></summary>${done.map(x=>todoRow(x,td)).join("")}</details>`;
  $("main").innerHTML=todoSwitch()+`<div class="td">${h}</div>`;
}
async function tickRound(id,k){
  const i=S.items.find(x=>x.id===id); if(!i||!canW()) return;
  const rs=JSON.parse(JSON.stringify(rounds(i))); if(!rs.length) rs.push({label:t("round",1),date:"",done:false});
  rs[k].done=!rs[k].done;
  const body={rounds:rs,updatedAt:Date.now(),updatedBy:S.me?.id||null};
  if(rs.every(r=>r.done)) body.status="done"; else if(i.status==="done") body.status="doing";
  try{ await S.db.doc("tasks/"+id).update(body); toast(rs[k].done?"ทำเครื่องหมายส่งแล้ว":"ยกเลิกเครื่องหมายแล้ว"); }catch(e){ werr(e); }
}

function colOk(i){ const q=S.q.trim().toLowerCase(); return (S.stream==="all"||streamOf(i)===S.stream)&&(!q||String(i.title||"").toLowerCase().includes(q)); }
function todoSwitch(){ const v=S.pmode||"date", w=canW();
  return `<div class="toolbar" style="justify-content:space-between"><div class="seg" role="group" aria-label="มุมมอง">
      <button type="button" data-pmode="date" aria-pressed="${v==="date"}">เรียงตามวัน</button>
      <button type="button" data-pmode="sub" aria-pressed="${v==="sub"}">รายคน</button>
      <button type="button" data-pmode="att" aria-pressed="${v==="att"}">เช็กชื่อประชุม</button></div>
    ${w&&v!=="date"?`<button type="button" class="btn quiet sm" data-roster="1">${I.users}จัดการรายชื่อ</button>`:""}</div>`; }
function renderPeople(){
  const w=canW(), td=TD(), mode=S.pmode;
  let h=todoSwitch();
  if(!roster().length){ $("main").innerHTML=h+`<p class="skeleton">ยังไม่มีรายชื่อ กด "จัดการรายชื่อ" เพื่อเพิ่มแบรนด์และทีมงาน</p>`; return; }
  const groups=roster().filter(g=>mode==="att"||g.kind==="brand");
  // columns sorted by date
  let cols=[];
  if(mode==="sub"){
    S.items.filter(i=>!isM(i)&&reqPeople(i).length&&colOk(i)).forEach(i=>rounds(i).forEach((r,k)=>cols.push({i,r,k,d:dnum(r.date)})));
  } else S.items.filter(i=>isM(i)&&reqPeople(i).length&&colOk(i)).forEach(i=>cols.push({i,d:dnum(i.date)}));
  cols.sort((a,b)=>(a.d??1e9)-(b.d??1e9)||String(a.i.title).localeCompare(b.i.title));
  if(!cols.length){ $("main").innerHTML=h+`<p class="skeleton">${mode==="sub"?"ยังไม่มีงานที่ต้องให้แบรนด์ส่ง":"ยังไม่มีประชุม"}</p>`; return; }
  const head=cols.map(c=>{ const i=c.i;
    if(mode==="sub"){ const x=subCount(i,c.r,c.k); const over=c.d!=null&&c.d<td&&!c.r.done;
      return `<th class="ch ${over?"over":""}"><button type="button" data-open="${esc(i.id)}"><span class="ct">${esc(i.title)}</span><span class="cr">${esc(c.r.label||t("round",c.k+1))}</span><span class="cd">${c.r.date?esc(fShort(c.r.date)):"ยังไม่กำหนดวัน"}</span><span class="cc">${x.done}/${x.total}</span></button></th>`; }
    const a=attCount(i); return `<th class="ch"><button type="button" data-open="${esc(i.id)}"><span class="ct">${esc(i.title)}</span><span class="cd">${i.date?esc(fShort(i.date)):"ยังไม่กำหนดวัน"}${i.from?" · "+esc(i.from):""}</span><span class="cc">มา ${a.yes}/${a.total}</span></button></th>`; }).join("");
  let body="";
  for(const g of groups){
    body+=`<tr class="gr"><th class="rh">${esc(g.name)}</th><td colspan="${cols.length}"></td></tr>`;
    for(const name of (g.people||[])){
      let need=0, got=0;
      const cells=cols.map(c=>{ const i=c.i; const inc=reqPeople(i).some(p=>p.name===name);
        if(!inc) return `<td class="na">–</td>`;
        need++;
        if(mode==="sub"){ const rk=rKey(c.r,c.k), v=subOf(i,rk,name); if(v) got++; const over=!v&&c.d!=null&&c.d<td;
          return `<td><button type="button" class="cell ${v?"yes":over?"over":""}" data-sub="${esc(i.id)}" data-rk="${esc(rk)}" data-k="${c.k}" data-name="${esc(name)}" aria-label="${esc(name)} ${esc(i.title)}" ${w?"":"disabled"}>${v?"<span>✓</span>":""}</button></td>`; }
        const v=attOf(i,name); if(v==="y") got++;
        return `<td><button type="button" class="cell ${v==="y"?"yes":v==="n"?"no":""}" data-att="${esc(i.id)}" data-name="${esc(name)}" aria-label="${esc(name)} ${esc(i.title)}" ${w?"":"disabled"}>${v==="y"?"<span>✓</span>":v==="n"?"<span>✗</span>":""}</button></td>`; }).join("");
      body+=`<tr><th class="rh"><b>${esc(name)}</b><small>${mode==="sub"?`ส่งแล้ว ${got}/${need}`:`มา ${got}/${need}`}</small></th>${cells}</tr>`;
    }
  }
  h+=`<div class="mx-wrap"><table class="mx"><thead><tr><th class="corner">${mode==="sub"?"ชื่อ / งานที่ต้องส่ง":"ชื่อ / ประชุม"}</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
   <div class="tl-legend">${mode==="sub"?`<span><i class="sw2 yes">✓</i>ส่งแล้ว</span><span><i class="sw2"></i>ยังไม่ส่ง</span><span><i class="sw2 over"></i>ยังไม่ส่ง · เลยกำหนด</span>`:`<span><i class="sw2 yes">✓</i>มา</span><span><i class="sw2 no">✗</i>ไม่มา</span><span><i class="sw2"></i>ยังไม่ตอบ</span>`}<span><i class="sw2 na">–</i>ไม่เกี่ยวข้อง</span><span>กดช่องเพื่อเปลี่ยน · เรียงตามวัน</span></div>`;
  $("main").innerHTML=h;
}

/* ---------------- agenda ---------------- */
function renderAgenda(){
  const m=S.meta||{}, w=canW(); const su=dnum(m.setupDate), st=dnum(m.startDate), en=dnum(m.endDate)??st;
  const set=new Set(); if(su!=null) set.add(su); if(st!=null) for(let n=st;n<=en;n++) set.add(n);
  S.agenda.forEach(a=>{const n=dnum(a.day); if(n!=null) set.add(n);});
  const days=[...set].sort((a,b)=>a-b);
  if(!days.length){ $("main").innerHTML=`<p class="skeleton">${esc(t("ag_empty"))}</p>`; return; }
  $("main").innerHTML=`<div class="days">${days.map(n=>{

async function saveItem(){

    updatedAt:Date.now(),updatedBy:S.me?.id||null};
  if(Array.isArray(d.who)) body.who=d.who; else if(id&&Array.isArray(TREE.byId[id]?.who)) body.who=TREE.byId[id].who;
  if(id){ const pv=TREE.byId[id]||{}; if(pv.subs) body.subs=pv.subs; if(pv.att) body.att=pv.att; }
  if(d.type==="meeting") Object.assign(body,{date:d.date||"",from:d.from||"",to:d.to||"",mlink:(d.mlink||"").trim(),agenda:d.agenda||"",summary:d.summary||""});
  else { const rs=d.rounds.map((r,k)=>({id:r.id||("r"+Date.now().toString(36)+k),label:(r.label||"").trim()||t("round",k+1),date:r.date||"",done:!!r.done})).filter((r,k,a)=>r.date||r.done||a.length===1);
    Object.assign(body,{start:d.start||"",rounds:rs,status:d.status||"todo",requirement:(d.requirement||"").trim()});
    if(body.status==="todo"&&hasInput({...body,id:id||"__new"})) body.status="doing"; }

  try{ if(id){ const prev=TREE.byId[id]||{}; await S.db.doc("tasks/"+id).set({createdAt:prev.createdAt||Date.now(),createdBy:prev.createdBy||null,...body});
         if(!parent) for(const k of descendants(id)) if(k.stream!==body.stream){ try{ await S.db.doc("tasks/"+k.id).update({stream:body.stream}); }catch(e){} } }
       else { body.createdAt=Date.now(); body.createdBy=S.me?.id||null; await S.db.collection("tasks").add(body);

}

function tickBlock(i){ // live per-person ticks for a saved item
  const ro=!canW(); const ppl=reqPeople(i); if(!ppl.length) return "";
  const groups=[...new Set(ppl.map(p=>p.group))];
  if(isM(i)){ const a=attCount(i);
    return `<div class="sec" id="tickBox"><h4>เช็กชื่อผู้เข้าประชุม <span class="cnt-b">มา ${a.yes} · ไม่มา ${a.no} · ยังไม่ตอบ ${a.total-a.yes-a.no}</span></h4><p class="hint" style="margin:0">กดชื่อเพื่อเปลี่ยน: ยังไม่ตอบ → มา ✓ → ไม่มา ✗</p>
      ${groups.map(g=>`<div class="tgrp"><span class="tg">${esc(g)}</span><div class="names">${ppl.filter(p=>p.group===g).map(p=>{const v=attOf(i,p.name);return `<button type="button" class="nm ${v==="y"?"yes":v==="n"?"no":""}" data-att="${esc(i.id)}" data-name="${esc(p.name)}" ${ro?"disabled":""}>${v==="y"?"✓ ":v==="n"?"✗ ":""}${esc(p.name)}</button>`;}).join("")}</div></div>`).join("")}</div>`; }
  const rs=rounds(i); if(!rs.length) return "";
  return `<div class="sec" id="tickBox"><h4>การส่งงานรายคน</h4><p class="hint" style="margin:0">กดชื่อเมื่อคนนั้นส่งงานรอบนั้นแล้ว ครบทุกคนแล้วรอบนั้นจะถูกติ๊กว่าส่งแล้วอัตโนมัติ</p>
    ${rs.map((r,k)=>{const rk=rKey(r,k);const c=subCount(i,r,k);return `<div class="tround"><div class="trh"><b>${esc(r.label||t("round",k+1))}</b>${r.date?` · <span>${esc(fShort(r.date))}</span>`:""}<span class="cnt-b">ส่งแล้ว ${c.done}/${c.total}</span></div>
      ${groups.map(g=>`<div class="tgrp"><span class="tg">${esc(g)}</span><div class="names">${ppl.filter(p=>p.group===g).map(p=>{const v=subOf(i,rk,p.name);return `<button type="button" class="nm ${v?"yes":""}" data-sub="${esc(i.id)}" data-rk="${esc(rk)}" data-k="${k}" data-name="${esc(p.name)}" aria-pressed="${v}" ${ro?"disabled":""}>${v?"✓ ":""}${esc(p.name)}</button>`;}).join("")}</div></div>`).join("")}</div>`;}).join("")}</div>`;
}
function redrawTicks(){ const box=$("tickBox"); if(!box||S.drawer?.kind!=="item"||!S.drawer.id) return; const i=S.items.find(x=>x.id===S.drawer.id); if(!i) return; const tmp=document.createElement("div"); tmp.innerHTML=tickBlock(i); if(tmp.firstElementChild) box.replaceWith(tmp.firstElementChild); }
async function toggleSub(id,rk,k,name){
  const i=S.items.find(x=>x.id===id); if(!i||!canW()) return;
  const on=!subOf(i,rk,name);
  const body={subs:{[rk]:{[name]:on?Date.now():null}},updatedAt:Date.now()};
  // local preview so the tap feels instant
  i.subs=i.subs||{}; i.subs[rk]={...(i.subs[rk]||{}),[name]:on?Date.now():null};
  const rs=JSON.parse(JSON.stringify(rounds(i))).map((r,j)=>({...r,id:r.id||"i"+j}));
  const c=subCount(i,rs[k],k);
  if(rs[k]&&c.total&&c.done===c.total&&!rs[k].done){ rs[k].done=true; body.rounds=rs; }
  else if(rs[k]&&rs[k].done&&!on){ rs[k].done=false; body.rounds=rs; }
  if(body.rounds){ if(body.rounds.every(r=>r.done)) body.status="done"; else if(i.status==="done") body.status="doing"; }
  if(!body.status&&(i.status||"todo")==="todo") body.status="doing";
  redrawTicks();
  try{ await S.db.doc("tasks/"+id).update(body); }catch(e){ werr(e); }
}
async function toggleAtt(id,name){
  const i=S.items.find(x=>x.id===id); if(!i||!canW()) return;
  const v=attOf(i,name), nv=v===""?"y":v==="y"?"n":null;
  i.att={...(i.att||{}),[name]:nv}; redrawTicks();
  try{ await S.db.doc("tasks/"+id).update({att:{[name]:nv},updatedAt:Date.now()}); }catch(e){ werr(e); }
}

/* workstream drawer */
function openStream(key){
  const list=streams(); const idx=key?list.findIndex(x=>x.key===key):-1; if(key&&idx<0) return;
  const cur=key?list[idx]:{key:"",name:""};
  const nItems=key?S.items.filter(i=>streamOf(i)===key).length:0;
  S.drawer={kind:"stream",key:key||null};
  let b=fld("sName","ชื่อหมวดงาน",cur.name,{ph:"เช่น สื่อมวลชน / เพรส (Press)"});
  if(key){
    b+=`<div class="field"><span class="fl">ลำดับการแสดง</span><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn quiet sm" data-smove="-1" ${idx===0?"disabled":""}>↑ เลื่อนขึ้น</button>
      <button type="button" class="btn quiet sm" data-smove="1" ${idx===list.length-1?"disabled":""}>↓ เลื่อนลง</button>
      <span class="hint" style="align-self:center">ลำดับที่ ${idx+1} จาก ${list.length}</span></div></div>`;
    b+=`<div class="sec"><h4>ลบหมวดนี้</h4>${nItems?`<div class="field"><label for="sMoveTo">มีงาน ${nItems} รายการในหมวดนี้ ย้ายไปที่</label><select class="inp" id="sMoveTo">${list.filter(x=>x.key!==key).map(x=>`<option value="${esc(x.key)}">${esc(x.name)}</option>`).join("")}</select></div>`:`<p class="hint" style="margin:0">หมวดนี้ยังไม่มีงาน ลบได้เลย</p>`}
      <div><button type="button" class="btn danger" id="delStream" ${list.length<2?"disabled":""}>${esc(t("del"))}</button></div></div>`;
  }
  shell(key?"แก้ไขหมวดงาน":"เพิ่มหมวดงาน",b,`<span class="grow"></span><button type="button" class="btn quiet" data-close>${esc(t("close"))}</button><button type="button" class="btn dark" id="saveStream">${esc(t("save"))}</button>`);
  setTimeout(()=>$("sName")?.focus(),30);
}
async function writeStreams(list){
  const clean=list.map(x=>({key:x.key,name:String(x.name).trim()})).filter(x=>x.name);
  if(S.meta&&Object.keys(S.meta).length) await S.db.doc("meta/event").update({streams:clean});
  else await S.db.doc("meta/event").set({streams:clean});
}
async function saveStream(){
  const name=$("sName").value.trim(); if(!name){ toast("กรุณาใส่ชื่อหมวดงาน"); $("sName").focus(); return; }
  const list=JSON.parse(JSON.stringify(streams())); const key=S.drawer.key;
  if(key){ const s=list.find(x=>x.key===key); if(s) s.name=name; } else list.push({key:"s"+Date.now().toString(36),name});
  try{ await writeStreams(list); closeDrawer(); toast(t("saved")); }catch(e){ werr(e); }
}
async function moveStream(dir){
  const list=JSON.parse(JSON.stringify(streams())); const key=S.drawer.key; const i=list.findIndex(x=>x.key===key), j=i+dir;
  if(i<0||j<0||j>=list.length) return; [list[i],list[j]]=[list[j],list[i]];
  try{ await writeStreams(list); S.meta={...S.meta,streams:list}; openStream(key); }catch(e){ werr(e); }
}
async function deleteStream(){
  const key=S.drawer.key, to=$("sMoveTo")?.value; buildTree();
  try{
    if(to) for(const r of TREE.roots.filter(i=>(i.stream||"")===key)){
      for(const x of [r,...descendants(r.id)]) await S.db.doc("tasks/"+x.id).update({stream:to}); }
    await writeStreams(streams().filter(x=>x.key!==key)); if(S.stream===key) S.stream="all";
    closeDrawer(); toast(t("deleted"));
  }catch(e){ werr(e); }
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-close],[data-open]"); if(!el) return; const ds=el.dataset;
  if(el.hasAttribute("data-close")){closeDrawer();return;}
  if(ds.tab){ S.tab=ds.tab; store.set("tab",S.tab); renderMain(); return; }
  if(ds.kind){ S.kind=ds.kind; renderMain(); return; }
  if(ds.stream){ S.stream=ds.stream; renderMain(); return; }
  if(ds.toggle){ S.collapsed.has(ds.toggle)?S.collapsed.delete(ds.toggle):S.collapsed.add(ds.toggle); store.set("col",JSON.stringify([...S.collapsed])); renderMain(); return; }
  if(ds.addsub){ openItem(null,{type:"task",parentId:ds.addsub}); return; }
  if(el.id==="addItem"||el.id==="fab"){ openItem(null,{type:"task"}); return; }
  if(el.id==="editEvent"){ openEvent(); return; }
  if(ds.new){ openItem(null,{type:ds.new,stream:ds.s}); return; }
  if(ds.open){ openItem(ds.open); return; }
  if(S.drawer?.kind==="item"){
    if(ds.type){ pullItem(); if(S.drawer.d.type!==ds.type) S.drawer.d.who=undefined; S.drawer.d.type=ds.type; drawItem(); return; }
    if(ds.st){ S.drawer.d.status=ds.st; document.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===ds.st)); return; }
    if(ds.rok!=null){ const on=el.getAttribute("aria-pressed")!=="true"; el.setAttribute("aria-pressed",on); el.textContent=on?"✓ "+t("rnd_done"):t("rnd_pending"); return; }
    if(el.id==="addRound"){ pullItem(); const n=S.drawer.d.rounds.length+1; S.drawer.d.rounds.push({id:"r"+Date.now().toString(36),label:t("round",n),date:"",done:false}); drawItem(); const r=document.querySelectorAll(".rnd .rdte"); r[r.length-1]?.focus(); return; }
    if(ds.rmr!=null){ pullItem(); S.drawer.d.rounds.splice(Number(ds.rmr),1); drawItem(); return; }
    if(ds.rmp!=null){ pullItem(); S.drawer.d.people.splice(Number(ds.rmp),1); drawItem(); return; }
    if(el.id==="addLink"){ pullItem(); S.drawer.d.links.push({label:"",url:""}); drawItem(); const r=document.querySelectorAll(".lnk .ll"); r[r.length-1]?.focus(); return; }
    if(ds.rmlink!=null){ pullItem(); S.drawer.d.links.splice(Number(ds.rmlink),1); drawItem(); return; }
  }
  if(S.drawer?.kind==="event"){
    if(el.id==="addStream"){ const m=pullEvent(); S.drawer.streams.push({key:"s"+Date.now().toString(36),name:""}); drawEvent(m); const r=document.querySelectorAll(".sname"); r[r.length-1]?.focus(); return; }
    if(ds.rms!=null){ const m=pullEvent(); S.drawer.streams.splice(Number(ds.rms),1); drawEvent(m); return; }
  }
  if(el.id==="saveItem"){ saveItem(); return; }
  if(el.id==="delItem"){ armDelete(el,deleteItem); return; }
  if(el.id==="postC"){ postComment(); return; }
  if(ds.delc){ S.db.doc("comments/"+ds.delc).delete().catch(werr); return; }
  if(el.id==="saveEvent"){ saveEvent(); return; }
  if(ds.agnew){ openAgenda(null,ds.agnew); return; }
  if(ds.agedit){ openAgenda(ds.agedit); return; }
  if(el.id==="saveAg"){ saveAgenda(); return; }
  if(el.id==="delAg"){ armDelete(el,async()=>{try{await S.db.doc("agenda/"+S.drawer.id).delete();closeDrawer();toast(t("deleted"));}catch(e){werr(e);}}); return; }
  if(ds.lnew){ openLink(null); return; }
  if(ds.ledit){ openLink(ds.ledit); return; }
  if(el.id==="saveLink"){ saveLink(); return; }
  if(el.id==="delLink"){ armDelete(el,async()=>{try{await S.db.doc("links/"+S.drawer.id).delete();closeDrawer();toast(t("deleted"));}catch(e){werr(e);}}); return; }
  if(el.id==="refreshBtn"){ S.db&&S.db.refresh(); return; }
  if(el.id==="apiSave"){ const v=$("apiIn").value.trim(); if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ toast("ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec"); return; } store.set("api",v); location.reload(); return; }
  if(el.id==="pinSave"){ const v=$("pinIn").value.trim(); if(!v) return; fetch(apiUrl()+"?action=checkpin&pin="+encodeURIComponent(v)).then(r=>r.json()).then(j=>{ if(j.ok){ store.set("pin",v); S.canWrite=true; renderMain(); toast("ปลดล็อกแล้ว"); } else toast("PIN ไม่ถูกต้อง"); }).catch(()=>toast(t("err"))); return; }
  if(el.id==="seedIn"){ el.disabled=true; el.textContent="กำลังนำเข้า…"; fetch("seed.json",{cache:"no-store"}).then(r=>r.json()).then(seed=>{ const ops=[]; Object.keys(seed).forEach(c=>Object.keys(seed[c]).forEach(id=>ops.push({op:"set",c,id,data:seed[c][id]}))); return S.db.batch(ops); }).then(()=>toast("นำเข้าข้อมูลแล้ว")).catch(()=>{ toast(t("err")); el.disabled=false; el.textContent="นำเข้าข้อมูลเดิม"; }); return; }
  if(ds.pmode){ S.pmode=ds.pmode; store.set("pmode",S.pmode); renderMain(); return; }
  if(ds.roster){ openRoster(); return; }
  if(S.drawer?.kind==="roster"){
    if(el.id==="addGroup"){ pullRoster(); S.drawer.groups.push({name:"",kind:"brand",people:[]}); drawRoster(); return; }
    if(ds.rmg!=null){ pullRoster(); S.drawer.groups.splice(Number(ds.rmg),1); drawRoster(); return; }
    if(el.id==="saveRoster"){ saveRoster(); return; }
  }
  if(ds.sub){ toggleSub(ds.sub,ds.rk,Number(ds.k),ds.name); if(S.tab==="todo"&&!S.drawer) renderMain(); return; }
  if(ds.att){ toggleAtt(ds.att,ds.name); if(S.tab==="todo"&&!S.drawer) renderMain(); return; }
  if(ds.who!=null&&S.drawer?.kind==="item"){ pullItem(); const D=S.drawer.d; const meet=D.type==="meeting"; const cur=Array.isArray(D.who)?[...D.who]:(meet?groupNames():groupNames("brand"));
    const ix=cur.indexOf(ds.who); if(ix>=0) cur.splice(ix,1); else cur.push(ds.who); D.who=cur; drawItem(); return; }
  if(ds.tlwide){ S.tlWide=!S.tlWide; store.set("tlwide",S.tlWide?"1":""); renderMain(); return; }
  if(ds.tick){ tickRound(ds.tick,Number(ds.k)); return; }
  if(ds.sedit){ openStream(ds.sedit); return; }
  if(ds.snew){ openStream(null); return; }
  if(el.id==="saveStream"){ saveStream(); return; }
  if(ds.smove){ moveStream(Number(ds.smove)); return; }
  if(el.id==="delStream"){ armDelete(el,deleteStream); return; }
  if(ds.copy){ copy(ds.copy,el); return; }
});
document.addEventListener("change",e=>{ if(e.target.id==="fParent"&&S.drawer?.kind==="item"){ pullItem(); drawItem(); } });

function makeSheetDb(url){
  const cache={}; const colL={}; const docL={}; let lastOk=0;
  const snapOf=c=>{ const m=cache[c]||{}; const docs=Object.keys(m).map(id=>({id,exists:true,data:()=>m[id],metadata:{}})); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}; };
  const emit=c=>{ (colL[c]||[]).forEach(f=>{try{f(snapOf(c));}catch(e){console.error(e);}}); Object.keys(docL).forEach(p=>{ const [cc,id]=p.split("/"); if(cc===c) docL[p].forEach(f=>{ const d=(cache[c]||{})[id]; try{f({id,exists:!!d,data:()=>d,metadata:{}});}catch(e){console.error(e);} }); }); };
  const emitAll=()=>["tasks","comments","agenda","links","meta"].forEach(emit);
  const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
  const merge=(b,p)=>{ const o=isObj(b)?JSON.parse(JSON.stringify(b)):{}; Object.keys(p).forEach(k=>{ const v=p[k]; o[k]=(isObj(v)&&isObj(o[k]))?merge(o[k],v):v; }); return o; };
  let inflight=0, pollTimer=null, failing=false;
  async function pull(){
    if(inflight) return;
    try{
      const r=await fetch(url+(url.includes("?")?"&":"?")+"action=list&t="+Date.now(),{cache:"no-store"});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||"list failed");
      if(inflight) return; // a write started meanwhile; next pull will reconcile
      ["tasks","comments","agenda","links","meta"].forEach(c=>cache[c]={});
      j.rows.forEach(x=>{ (cache[x.c]=cache[x.c]||{})[x.id]=x.data; });
      lastOk=Date.now(); failing=false; S.pinRequired=!!j.pin; S.netErr=false; emitAll(); renderSync();
    }catch(e){ failing=true; S.netErr=true; renderSync(); if(!lastOk){ emitAll(); } }
  }
  async function send(body){
    inflight++;
    try{
      const pin=store.get("pin",""); if(pin) body.pin=pin;
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
      const j=await r.json();
      if(!j.ok){ if(j.error==="pin"){ S.pinRequired=true; store.set("pin",""); S.canWrite=false; renderMain(); } throw {code:j.error==="pin"?"pin":"unavailable",message:j.error}; }
      return j;
    } finally { inflight--; setTimeout(pull,400); }
  }
  function docRef(path){ const [c,id]=path.split("/");
    return { id, path,
      get:async()=>{ const d=(cache[c]||{})[id]; return {id,exists:!!d,data:()=>d,metadata:{}}; },
      set:async(data)=>{ (cache[c]=cache[c]||{})[id]=JSON.parse(JSON.stringify(data)); emit(c); await send({action:"set",c,id,data}); },
      update:async(data)=>{ const cur=(cache[c]||{})[id]; if(!cur) throw {code:"invalid_argument",message:"not found"}; cache[c][id]=merge(cur,data); emit(c); await send({action:"update",c,id,data}); },
      delete:async()=>{ if(cache[c]) delete cache[c][id]; emit(c); await send({action:"delete",c,id}); },
      onSnapshot:(f)=>{ (docL[path]=docL[path]||[]).push(f); if(lastOk){ const d=(cache[c]||{})[id]; f({id,exists:!!d,data:()=>d,metadata:{}}); } return ()=>{ docL[path]=docL[path].filter(x=>x!==f); }; },
      collection:()=>{ throw new Error("nested collections not used"); } }; }
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function colRef(c){ return { path:c,
      doc:(id)=>docRef(c+"/"+(id||newId())),
      add:async(data)=>{ const id=newId(); await docRef(c+"/"+id).set(data); return docRef(c+"/"+id); },
      onSnapshot:(f)=>{ (colL[c]=colL[c]||[]).push(f); if(lastOk) f(snapOf(c)); return ()=>{ colL[c]=colL[c].filter(x=>x!==f); }; } }; }
  function startPolling(){ clearInterval(pollTimer); pollTimer=setInterval(()=>{ if(document.visibilityState==="visible") pull(); },15000); }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pull(); });
  pull(); startPolling();
  return { doc:docRef, collection:colRef, refresh:pull, batch:(ops)=>send({action:"batch",ops}), lastOk:()=>lastOk, cache };
}
function renderSync(){ const el=$("syncInfo"); if(!el||!S.db) return; const t0=S.db.lastOk();
  el.innerHTML=S.netErr?`<span style="color:var(--bad)">เชื่อมต่อไม่ได้ · ลองใหม่</span>`:(t0?`อัปเดตล่าสุด ${new Date(t0).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}`:"กำลังโหลด…"); }

/* ---------------- boot ---------------- */
renderMain();
(()=>{
  const url=apiUrl();
  if(!url){ S.dbState="setup"; S.loaded=true; renderMain(); return; }
  S.me={id:DEVICE}; S.user=null;
  const db=makeSheetDb(url); S.db=db; S.dbState="ok";
  const ld={items:0,meta:0}; const ready=()=>{ if(ld.items&&ld.meta) S.loaded=true; };
  db.collection("tasks").onSnapshot(s=>{ S.items=s.docs.map(d=>({id:d.id,type:"task",...d.data()})); ld.items=1; ready(); renderMain();
    if(S.drawer?.kind==="item"&&S.drawer.id&&!S.items.find(x=>x.id===S.drawer.id)) closeDrawer(); else redrawTicks(); });
  db.doc("meta/event").onSnapshot(s=>{ S.meta=s.exists?s.data():{}; ld.meta=1; ready(); renderMain(); });
  db.collection("agenda").onSnapshot(s=>{ S.agenda=s.docs.map(d=>({id:d.id,...d.data()})); if(S.loaded) renderMain(); });
  db.collection("links").onSnapshot(s=>{ S.links=s.docs.map(d=>({id:d.id,...d.data()})); if(S.loaded) renderMain(); });
  db.collection("comments").onSnapshot(s=>{ S.comments=s.docs.map(d=>({id:d.id,...d.data()})); if(S.loaded&&!S.drawer) renderMain(); drawComments(); });
})();
})();
</script>
